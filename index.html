    <style>
        :root {
            --primary-color: #1b4f72;
            --secondary-color: #117a65;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            flex: 1;
            max-width: 900px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 90%;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        h2 {
            color: var(--secondary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }

        button:hover {
            background-color: #0e6655;
        }

        .btn-secondary {
            background-color: #7f8c8d;
        }
        .btn-secondary:hover {
            background-color: #707b7c;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
            font-size: 16px;
        }

        .footer-details {
            margin-top: 5px;
        }

        .blinking-text {
            font-weight: bold;
            animation: digitalGlow 1.5s infinite alternate;
        }

        @keyframes digitalGlow {
            0% { color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
            50% { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
            100% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
        }

        @media print {
            footer, .btn-container, .no-print {
                display: none !important;
            }
            body {
                background: white;
            }
            .container {
                box-shadow: none;
                margin: 0;
                width: 100%;
                padding: 0;
            }
        }

        .preview-box {
            background: #fdfdfd;
            border: 1px dashed #bdc3c7;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .question-section {
            margin-bottom: 20px;
        }

        .question-section h4 {
            background: #e8f8f5;
            padding: 8px 12px;
            border-left: 4px solid var(--secondary-color);
            margin-bottom: 10px;
            color: #117a65;
        }

        .question-item {
            margin-bottom: 12px;
            line-height: 1.5;
        }
    </style>
</head>

    <header>

    </header>

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

                return;

            document.getElementById('footerSchool').innerText = "ಶಾಲೆಯ ಹೆಸರು: " + school;
            document.getElementById('footerTeacher').innerText = "ಶಿಕ್ಷಕರ ಹೆಸರು: " + teacher;

            const lesson = questionBank[lessonKey];

            let html = `

                    <ol>
            `;
            lesson.mcqs.forEach((item, index) => {
                html += `<li class="question-item">${item.q}

            html += `
